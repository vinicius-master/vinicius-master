<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#049fd9" />
      <stop offset="50%" stop-color="#5391FE" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="12" />
  <rect width="1200" height="350" fill="url(#grid)" rx="12" />

  <!-- Network Topology Graphic Elements (Abstract Nodes & Links) -->
  <g stroke="#049fd9" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="150" y1="100" x2="300" y2="180" />
    <line x1="300" y1="180" x2="450" y2="120" />
    <line x1="450" y1="120" x2="600" y2="220" />
    <line x1="600" y1="220" x2="750" y2="140" />
    <line x1="750" y1="140" x2="900" y2="200" />
    <line x1="900" y1="200" x2="1050" y2="110" />
    <line x1="300" y1="180" x2="350" y2="260" />
    <line x1="750" y1="140" x2="820" y2="250" />
  </g>

  <!-- Glowing Data Packets / Nodes -->
  <g fill="#5391FE" filter="url(#glow)">
    <circle cx="150" cy="100" r="5" />
    <circle cx="300" cy="180" r="7" fill="#049fd9" />
    <circle cx="450" cy="120" r="5" />
    <circle cx="600" cy="220" r="6" fill="#22c55e" />
    <circle cx="750" cy="140" r="7" fill="#049fd9" />
    <circle cx="900" cy="200" r="5" />
    <circle cx="1050" cy="110" r="6" fill="#22c55e" />
    <circle cx="350" cy="260" r="4" />
    <circle cx="820" cy="250" r="4" />
  </g>

  <!-- Floating Binary / Code Bits (Cybersecurity & Automation Vibe) -->
  <g fill="#30363d" font-family="monospace" font-size="12" opacity="0.6">
    <text x="80" y="70">01101110</text>
    <text x="980" y="80">10110010</text>
    <text x="1000" y="300">01011100</text>
    <text x="100" y="290">11001011</text>
  </g>

  <!-- Central Content Box -->
  <g transform="translate(60, 0)">
    <!-- Terminal / Status Badge -->
    <g transform="translate(0, 75)">
      <rect width="210" height="32" rx="16" fill="#1f242d" stroke="#30363d" stroke-width="1" />
      <circle cx="20" cy="16" r="5" fill="#22c55e" />
      <text x="35" y="21" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SYSTEM ONLINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Vinicius Clemente
    </text>

    <!-- Subtitle / Role with Gradient Accent -->
    <text x="0" y="195" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">
      Network &amp; Infrastructure Engineer &amp;• Automation &amp;• Cybersecurity
    </text>

    <!-- Tech Stack Mini Badges / Tags -->
    <g transform="translate(0, 230)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="52.5" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cisco ACI</text>

      <!-- Tag 2 -->
      <rect x="115" y="0" width="105" height="26" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="167.5" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SD-WAN</text>

      <!-- Tag 3 -->
      <rect x="230" y="0" width="115" height="26" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="287.5" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python / Nornir</text>

      <!-- Tag 4 -->
      <rect x="355" y="0" width="105" height="26" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="407.5" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ansible</text>

      <!-- Tag 5 -->
      <rect x="470" y="0" width="130" height="26" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="535" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cybersecurity</text>
    </g>
  </g>
</svg>
